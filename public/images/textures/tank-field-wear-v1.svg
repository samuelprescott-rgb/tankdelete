    <path fill="url(#silt)" d="m161 145 11-8 10 1 8-5 11 5 4 7-11 6-3 11-8 3-5 17-5-10 0-13-9-4zm113 8 6-11 11-5 7 2 2 6-9 4-4 16-8 8 1-15z"/>

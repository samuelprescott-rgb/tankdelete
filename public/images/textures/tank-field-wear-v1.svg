<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <title>Field paint study: two cast cheeks and two folded front guards</title>
  <!-- Transparent between features. The left column unrolls the cheek from
       bustle to mantlet; the right is the forward guard from rail to nose.
       These are four specific locations, not a repeating material swatch. -->
  <defs>
    <linearGradient id="dry" x1="0" y1=".75" x2="1" y2=".25" gradientUnits="objectBoundingBox">
      <stop stop-color="#7c8166" stop-opacity=".08"/><stop offset=".29" stop-color="#9d9e81" stop-opacity=".55"/>
      <stop offset=".73" stop-color="#9fa286" stop-opacity=".74"/><stop offset="1" stop-color="#81876e" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="steel"><stop stop-color="#605f54"/><stop offset=".37" stop-color="#93958a"/><stop offset=".76" stop-color="#adb09d"/><stop offset="1" stop-color="#707567"/></linearGradient>
    <linearGradient id="silt" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#715c49" stop-opacity=".20"/><stop offset=".64" stop-color="#947a5b" stop-opacity=".73"/><stop offset="1" stop-color="#ad9872" stop-opacity=".49"/></linearGradient>
    <linearGradient id="oldCoat" x1=".14" y1=".12" x2=".81" y2=".92"><stop stop-color="#65735e" stop-opacity=".04"/><stop offset=".46" stop-color="#53604f" stop-opacity=".49"/><stop offset=".78" stop-color="#5e6654" stop-opacity=".71"/><stop offset="1" stop-color="#837b63" stop-opacity=".29"/></linearGradient>
  </defs>
  <!-- Starboard cheek. The large irregular sunrub receives a narrower,
       broken knife of exposed alloy at the proud shoulder past the number. -->
  <g>
    <path fill="url(#oldCoat)" d="m123 116 31-17 22-2 11-7 37-5 26-13 25-4 13-5 22 1 14-9 29-5 6 9-20 12-13 3-10 12-18 2-16 12-24 4-11 9-18 0-24 12-27 0-16 9-22 1-13 7-20-1z"/>
    <path fill="url(#dry)" d="M115 122c31-9 39-20 67-28l13 2 18-10 23-3 9-6 18 0 17-5 19 2 20-11 14 0 21-9 17 1 28-15 17-3-25 19-18 5-10 8-18 6-19 0-16 8-26 4-5 4-21 1-17 8-19 0-18 8-18 1-20 8z"/>
    <path fill="#838873" opacity=".58" d="m195 103 27-9 11 1 10-5 7 1-17 8-14 1zm88-28 21-8 9 1-12 6-9 1zm33-11 11-4 5 1-11 4z"/>
    <path fill="#615d4c" opacity=".87" d="m401 47 20 1 19 9 7 6 12 6 11 14 6 5 9 17-3 2-8-12-8-5-6-10-15-8-9-10-13-5-15-3z"/>
    <path fill="url(#steel)" d="m420 50 15 5 8 6-6-1-9-4-11-3zm26 11 13 10 5 7-8-6-3-5zm16 16 7 6 4 7-6-5z"/>
    <path fill="#8e8e71" opacity=".80" d="m429 45 10 3 8 5-10-4zm40 24 6 9-8-8z"/>
    <!-- Returned paint at the first two grab feet. The stain narrows
         downhill, but the oxide and metal only sit at the upper contact. -->
    <path fill="url(#silt)" d="m253 143 15-7 13-4 9 3 8 9-12 1-2 11-7 4-5 13-3 18-7-12 1-14-6-8 2-5-13 0zm-80 4 14-7 9 1 10 6-8 4-9 2-5 10-1 8-5-7 1-12z"/>
    <path fill="#5b5142" d="m272 139 11-5 8 3 5 5-9-2-8 4-8 0zm-89 7 7-3 7 2-6 1-4 4z"/>
    <path fill="url(#steel)" d="m276 138 9-2 6 2-8 1-7 2zm-89 7 5-2 3 1-6 2z"/>
    <path fill="#a69b79" opacity=".77" d="m253 156 8-3 4 1-5 3zm19 14 4-8 2-2-3 8z"/>
    <path fill="#8a876a" opacity=".74" d="m262 131 6-4 4 0-4 3zm-15 9 11-4-4 3-6 2zm49-9 6 3-1 2-5-2zm21-45 12-6 4 0-8 5zm23-10 5-3 3 1-6 3z"/>
  </g>

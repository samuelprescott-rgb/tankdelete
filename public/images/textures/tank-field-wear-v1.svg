  <g transform="translate(512 0)">
    <path fill="url(#oldCoat)" d="m28 141 32 0 29 7 31-3 27 5 39-1 23 5 39-1 22 4 41-5 22 2 32-5 19 1 33-9 27-1 21-6 24 2-6 42-20 17-7 17-26 3-24 9-42 2-32 10-39 2-37-2-27 3-39-6-24-1-19-6-32 0-20-6-29-1-18-8-23-3z"/>
    <path fill="url(#silt)" d="m12 60 36-6 36 3 16-4 28 2-22 7-32 5-21-1-20 6-20-3zM334 92l37-2 24 2 17 8-8 13-14 3-9 10-17 2-31 14-27 4 17-15 20-8 7-9-18-8z"/>
    <path fill="#6b6451" opacity=".83" d="m345 100 16-4 27 1 10 3-14 4-23 0-17 5 7-6z"/>

    <path fill="url(#steel)" d="m178 142 8-3 7 1-7 1-7 3zm107 2 5-4 5 1-6 3z"/>
    <path fill="#625d4e" d="m421 47 16 3 6 5 12 9 5 8 7 6 6 12-4-4-6-4-5-8-10-7-6-7-11-5-11-4z"/>
    <path fill="url(#steel)" d="m426 49 10 3 6 5-6-2zm20 10 7 5 5 7-7-5z"/>
  </g>
  <!-- Starboard front sheet. A dragged olive-to-primer island crosses

    <path fill="#74644f" d="m466 146 13-7 15-2-3 9-8 4 3 8-6 5-4 13-7 5-1 12-9 8-5 15-8 7 3-15 7-12 1-11 8-10 1-7 6-5-2-9 5-4z"/>
    <path fill="url(#steel)" d="m480 141 12-3-2 5-9 4zm1 12 3-2-3 10-5 4zm-8 18-3 9-5 5 2-8zm-12 24-2 7-5 6 1-6z"/>
    <path fill="#746651" d="m54 228 16 1 13 6 25-1 20 5 37 2 16 6 34 2 12 5-44-2-21-5-28 0-23-5-33 0-17-8-17-2z"/>
    <path fill="url(#steel)" d="m62 229 13 1 9 5-10-2zm47 6 18 2 9 3-17-1zm64 9 13 3 17 1-13 1z"/>
    <path fill="#9b916e" opacity=".72" d="m24 190 13 0 17 6-13-1zm11 9 9 1 8 4-11-3z"/>
    <path fill="#645e4e" opacity=".84" d="m450 183 12-5-3 6-10 4zm-4 12 9-6-1 4-7 4zm-72 23 24-9-8 5-15 6zm-265-9 18 4 13 6-15-5z"/>
    <path fill="#a5a081" opacity=".81" d="m449 187 6-3-2 3-6 2zm-68 30 15-7-3 3-10 5zm-274-12 8 3-4 0z"/>
  </g>
  <!-- Port front sheet is greener and cleaner inboard, with one broad
       ochre transfer and a shortened scrape licking over the leading rim. -->
  <g transform="translate(512 256)">
    <path fill="url(#oldCoat)" d="m23 144 31-2 27 4 27-1 24 4 18-2 26 4 23-2 35 5 22-2 28 3 34-3 25 1 31-6 19 0 31-8 21 1 28-6 19 1-5 37-20 15-8 19-22 3-25 11-34 1-18 7-35 3-27-3-28 3-25-4-31 2-27-5-26 0-19-6-26 0-17-6-27-1-14-9-14-2z"/>
    <path fill="url(#silt)" d="m15 61 31-9 25 1 18-4 28 3-15 9-23 2-21 9-24-1-19 7zm325 43 23-9 24 2 18 6 3 10-11 5-10 0-13 8-20 3-23 10-19 0 18-12 18-6 7-8-22-1z"/>
    <path fill="#685f4c" d="m352 103 16-5 19 1 11 5-15 1-12-3-13 5z"/>
    <path fill="url(#steel)" d="m365 100 12-1 9 1-11 2-8 0z"/>
    <path fill="url(#dry)" d="m20 140 31 0 26 4 29-2 20 4 23-2 31 4 23-2 29 4 31-2 28 4 34-4 19 1 32-6 29 0 22-5 22 2 28-8 18 1-22 9-12 1-20 8-23 2-17 8-31 1-24 7-30-1-29 3-18-4-36 1-21-4-36 0-24-6-19 1-20-7-28-2z"/>
    <path fill="url(#silt)" d="m331 158 32-7 19 0 14-7 24 0 14-5 22 1-16 11-14 2-21 10-20 0-15 5-23 1-19 5-21-2z"/>
    <path fill="#756550" d="m486 144 12-5-4 12-9 5 1 5-7 8-6 16-7 7-3 12-7 6 2-15 7-11 3-14 7-6 2-9-3-4zM82 232l14 1 15 7 31-1 19 6 27 1 17 6-33-2-15-3-23 0-24-6-18-1z"/>
    <path fill="url(#steel)" d="m486 146 9-5-2 5-7 5zm-8 18 6-6-2 7-7 7zm-6 13-3 9-4 5 2-7zm-380 57 9 1 7 4-8-2zm48 6 15 3 9 3-13-2z"/>
    <path fill="#726650" opacity=".82" d="m425 180 17-9-4 6-13 5zm16-10 9-6 5-1-7 5zm-291 51 26 3 21 7-19-3zm245-11 12-5-3 3-9 4z"/>
    <path fill="#aba286" opacity=".81" d="m432 176 9-6 2 0-9 7zm-257 50 16 4-6 0z"/>

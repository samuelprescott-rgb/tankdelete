  <g transform="translate(0 256)">
    <path fill="url(#oldCoat)" d="m118 115 26-17 29-2 19-9 21 0 17-11 19-2 10-7 24-3 15-8 22-1 13-7 29-6-7 11-19 7-11 10-17 2-15 12-19 3-15 10-26 4-14 9-28 1-22 10-18 0-12 4z"/>
    <path fill="url(#dry)" d="m123 109 24-10 20-1 11-7 20 0 17-11 20-2 14-9 21 1 20-11 9 1 21-9 22 0 23-9 25-4-13 12-20 4-12 6-22 2-14 7-18 1-19 10-15-1-13 8-13-1-22 10-18 0-22 9-13 1z"/>
